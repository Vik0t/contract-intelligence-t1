# Development through API: CPU image, no NVIDIA GPU or local model downloads.
# Models and backends are selected in .env.api, not overridden here.
services:
  backend:
    image: contract-intelligence-backend:api
    build:
      args:
        RUNTIME_IMAGE: ubuntu:24.04
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    gpus: !reset []
    networks: !override [private, inference]
  ml-check:
    image: contract-intelligence-backend:api
    gpus: !reset []
    networks: !override [private, inference]
    command: [python, -m, scripts.ml_check, --output, /reports/ml-check-api.json]
networks:
  inference:

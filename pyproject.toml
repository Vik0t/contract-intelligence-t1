[project]
name = "contract-intelligence-t1"
version = "0.1.0"
description = "Contract extraction, evidence review, summaries and risk analysis"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "bcrypt==5.0.0",
    "certifi==2026.7.22",
    "click==8.4.2",
    "detect-installer==0.1.0",
    "dnspython==2.8.0",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "fastapi-cli==0.0.32",
    "fastapi-cloud-cli==0.23.0",
    "fastar==0.11.0",
    "filelock==3.32.2",
    "fsspec==2026.7.0",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httptools==0.8.0",
    "httpx==0.28.1",
    "huggingface-hub==1.27.0",
    "idna==3.18",
    "jinja2==3.1.6",
    "lxml==6.1.1",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "accelerate==1.14.0; sys_platform != 'darwin'",
    "bitsandbytes==0.50.2; sys_platform != 'darwin'",
    "mlx==0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-metal==0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numpy==2.5.2",
    "packaging==26.3",
    "pillow==12.3.0",
    "protobuf==7.35.1",
    "psycopg2==2.9.12",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pydantic-extra-types==2.11.1",
    "pydantic-settings==2.15.0",
    "pygments==2.20.0",
    "pymupdf==1.28.2",
    "pytesseract==0.3.13",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "rich==15.0.0",
    "rich-toolkit==0.20.3",
    "rignore==0.8.1",
    "safetensors==0.8.0",
    "sentencepiece==0.2.2",
    "sentry-sdk==2.67.1",
    "setuptools==84.0.0",
    "shellingham==1.5.4",
    "sqlalchemy==2.0.52",
    "starlette==1.6.0",
    "sympy==1.14.0; sys_platform == 'win32'",
    "sympy==1.13.1; sys_platform != 'win32'",
    "tokenizers==0.22.2",
    "torch==2.14.0+cu130; sys_platform == 'win32'",
    "torch==2.6.0; sys_platform != 'win32'",
    "torchvision==0.29.0+cu130; sys_platform == 'win32'",
    "torchvision==0.21.0; sys_platform != 'win32'",
    "tqdm==4.70.0",
    "transformers==5.15.0",
    "typer==0.27.1",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.3",
    "urllib3==2.7.0",
    "uvicorn==0.52.1",
    "uvloop==0.22.1; sys_platform != 'win32'",
    "watchfiles==1.2.0",
    "websockets==17.0.1",
    "gradio-client==2.7.0",
    "openai>=3.17.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

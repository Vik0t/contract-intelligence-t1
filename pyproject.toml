[project]
name = "contract-intelligence-t1"
version = "0.1.0"
description = "Contract information extraction pipeline"
readme = "README.md"

requires-python = ">=3.12,<3.13"

dependencies = [
    "accelerate>=1.0,<2",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.140.13",
    "gdown>=6.1.0",
    "ocrmypdf>=17.8.1",
    "pdf2image>=1.17.0",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "transformers>=5.0,<6",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pydantic>=2.13.4",
    "mlx-lm>=0.31.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]